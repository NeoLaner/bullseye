[package]
name = "bullseye"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Customizable VPN kill switch for Linux - nftables enforcement, TUI, works with any VPN"
repository = "https://github.com/NeoLaner/bullseye"
keywords = ["vpn", "killswitch", "nftables", "firewall", "tui"]
categories = ["command-line-utilities"]

[dependencies]
ratatui = "0.30.2"
# Added per build stage (see PLAN.md), not up front. Stage 1 needed none.
#   stage 2  serde_json — xray configs put `address` under `dns.servers` as well as
#            under `outbounds`, so the upstream has to be read from a real parse.
#            A text scan would open holes to the user's DNS resolvers and miss the
#            actual server.
#   stage 5  ratatui
#   stage 6  ksni — the tray is a StatusNotifierItem, which is a D-Bus service, and
#            there is no shelling out to one. `blocking` keeps the API synchronous
#            like the rest of bullseye, but zbus underneath still needs a runtime,
#            so PLAN's "no tokio" ends here rather than being quietly true.
serde_json = "1"
toml = "1.1.5"
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "tokio"] }

[profile.release]
strip = true
