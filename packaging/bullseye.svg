<!-- The mark, at the same proportions src/tray.rs draws it in: bands at
     0.72-0.98, 0.34-0.56 and 0-0.18 of the radius. The tray needs no file — it
     draws its own pixmaps — so this is for the desktop entry, the AUR package
     and anywhere else that wants the logo rather than an icon. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <g fill="none" stroke="#de2821">
    <circle cx="50" cy="50" r="42.5" stroke-width="13"/>
    <circle cx="50" cy="50" r="22.5" stroke-width="11"/>
  </g>
  <circle cx="50" cy="50" r="9" fill="#de2821"/>
</svg>
